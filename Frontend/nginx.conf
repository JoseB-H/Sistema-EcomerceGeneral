server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=1s ipv6=off;
    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
